[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucsb-ai-benchmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adjusttext>=1.4.0",
    "inspect-ai>=0.3.252",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "scicode",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
scicode = { path = "SciCode", editable = true }

[project.scripts]
bench = "bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
